<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocephin Calculator</title>
    
    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for translating JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, Component } = React;

        // --- GLOBAL ERROR BOUNDARY CLASS ---
        class ErrorBoundary extends Component {
            constructor(props) {
                super(props);
                this.state = { hasError: true }; // Set true initially or false to test normal operation
                this.state = { hasError: false };
            }

            static getDerivedStateFromError(error) {
                return { hasError: true };
            }

            componentDidCatch(error, errorInfo) {
                console.error("Calculator Error Caught:", error, errorInfo);
            }

            render() {
                if (this.state.hasError) {
                    return (
                        <div className="max-w-md mx-auto min-h-screen p-4 sm:p-6 flex items-center justify-center">
                            <div className="bg-white p-6 rounded-xl shadow-lg border border-red-200 text-center space-y-4">
                                <div className="p-3 bg-red-100 text-red-600 rounded-full w-12 h-12 mx-auto flex items-center justify-center">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
                                </div>
                                <h1 className="text-xl font-bold text-slate-800">Application Error</h1>
                                <p className="text-sm text-slate-600 leading-relaxed">
                                    The calculator encountered an unexpected loading issue or browser extension conflict.
                                </p>
                                <div className="bg-slate-50 p-3 rounded-lg border border-slate-100 text-xs text-left text-slate-500 space-y-1">
                                    <p className="font-semibold text-slate-700">How to report or resolve:</p>
                                    <p>• Refresh the webpage or try a personal device.</p>
                                    <p>• Contact the developer directly: <strong>joshcoleman1005@gmail.com</strong></p>
                                </div>
                                <button 
                                    onClick={() => window.location.reload()} 
                                    className="w-full bg-blue-600 text-white rounded-lg py-2 text-sm font-medium hover:bg-blue-700 transition-colors"
                                >
                                    Reload App
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // --- ICONS ---
        const CalculatorIcon = ({size=24, className=""}) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg>
        );
        const SyringeIcon = ({size=24, className=""}) => (
             <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m18 15-6-6"/><path d="m17 10 4-4"/><path d="m12 5 4-4"/><path d="m5 16 6-6"/><path d="m8 20 6-6"/><path d="m1 21 2-2"/><path d="m19 6 3-3"/><path d="m2 18 3 3"/></svg>
        );
        const AlertCircleIcon = ({size=24, className=""}) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
        );
        const InfoIcon = ({size=24, className=""}) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        );
        const BabyIcon = ({size=24, className=""}) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M9 12h.01"/><path d="M15 12h.01"/><path d="M10 16c.5.3 1.2.5 2 .5s1.5-.2 2-.5"/><path d="M19 6.3a9 9 0 0 1 1.8 3.9 2 2 0 0 1 0 3.8 9 9 0 0 1-17.6 0 2 2 0 0 1 0-3.8A9 9 0 0 1 12 3v0a9 9 0 0 1 7 3.3z"/></svg>
        );
        const UserIcon = ({size=24, className=""}) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        );

        // --- MAIN APP COMPONENT ---
        const RocephinCalculator = () => {
            const [doseOrdered, setDoseOrdered] = useState('');
            const [vialSize, setVialSize] = useState('1000'); 
            const [lidoConc, setLidoConc] = useState('1'); 
            const [ageGroup, setAgeGroup] = useState('child_older');
            const [result, setResult] = useState(null);

            const VIAL_DATA = {
                '500': { mg: 500, diluent: 1.0, totalVolume: 1.4 },
                '1000': { mg: 1000, diluent: 2.1, totalVolume: 2.9 }
            };

            const AGE_GUIDELINES = {
                'infant': { label: 'Infant (< 1 yr)', maxPerSite: 1.0 },
                'toddler': { label: 'Toddler (1-2 yrs)', maxPerSite: 1.5 },
                'child_older': { label: 'Child (> 2 yrs)', maxPerSite: 2.0 }
            };

            useEffect(() => {
                calculate();
            }, [doseOrdered, vialSize, lidoConc, ageGroup]);

            const getRecommendedVial = () => {
                const dose = parseFloat(doseOrdered);
                if (!dose || isNaN(dose)) return null;
                return dose <= 500 ? '500' : '1000';
            };
            const recommendedVial = getRecommendedVial();

            const calculate = () => {
                const dose = parseFloat(doseOrdered);
                if (!dose || isNaN(dose)) {
                    setResult(null);
                    return;
                }

                const vial = VIAL_DATA[vialSize];
                const calculatedVolume = (dose / vial.mg) * vial.totalVolume;
                const roundedVolume = Math.round(calculatedVolume * 10) / 10;
                
                const guideline = AGE_GUIDELINES[ageGroup];
                const numInjections = Math.ceil(roundedVolume / guideline.maxPerSite);
                
                const totalDiluentNeeded = vial.diluent;
                const lidoVol = lidoConc === '1' ? totalDiluentNeeded : (totalDiluentNeeded / 2).toFixed(2);
                const salineVol = lidoConc === '2' ? (totalDiluentNeeded / 2).toFixed(2) : 0;

                setResult({
                    volume: roundedVolume,
                    exactVolume: calculatedVolume.toFixed(2),
                    numInjections,
                    maxPerSite: guideline.maxPerSite,
                    vialUsed: vial,
                    lidoVol,
                    salineVol
                });
            };

            return (
                <div className="max-w-md mx-auto min-h-screen p-4 sm:p-6 pb-20">
                    
                    <div className="bg-blue-600 text-white p-4 rounded-xl shadow-lg mb-6 flex items-center gap-3">
                        <div className="bg-white/20 p-2 rounded-lg">
                            <CalculatorIcon size={24} />
                        </div>
                        <div>
                            <h1 className="text-xl font-bold">Rocephin Calculator</h1>
                            <p className="text-blue-100 text-xs">IM Reconstitution Helper</p>
                        </div>
                    </div>

                    <div className="space-y-6">
                        <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-4">
                            <h2 className="font-semibold text-slate-700 flex items-center gap-2">
                                <InfoIcon size={18} /> Medication Details
                            </h2>

                            {/* Dose Input */}
                            <div>
                                <label className="block text-sm font-medium text-slate-600 mb-1">Dose Ordered (mg)</label>
                                <div className="relative">
                                    <input
                                        type="number"
                                        value={doseOrdered}
                                        onChange={(e) => setDoseOrdered(e.target.value)}
                                        placeholder="e.g. 500"
                                        className="w-full pl-3 pr-12 py-3 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-lg font-medium"
                                    />
                                    <span className="absolute right-4 top-3.5 text-slate-400 font-medium">mg</span>
                                </div>
                            </div>

                            {/* Vial Selection */}
                            <div>
                                <label className="block text-sm font-medium text-slate-600 mb-2">Vial Size Available</label>
                                <div className="grid grid-cols-2 gap-3">
                                    {Object.keys(VIAL_DATA).map((size) => (
                                        <button
                                            key={size}
                                            onClick={() => setVialSize(size)}
                                            className={`p-3 rounded-lg border text-sm font-medium transition-all relative ${
                                                vialSize === size ? 'bg-blue-50 border-blue-500 text-blue-700 shadow-sm' : 'bg-white border-slate-200 text-slate-600'
                                            }`}
                                        >
                                            {recommendedVial === size && (
                                                <span className="absolute -top-2.5 right-2 bg-emerald-100 text-emerald-700 text-[10px] font-bold px-2 py-0.5 rounded-full border border-emerald-200 shadow-sm">Suggested</span>
                                            )}
                                            {size} mg
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Lidocaine Selection */}
                            <div>
                                <label className="block text-sm font-medium text-slate-600 mb-2">Lidocaine Concentration Available</label>
                                <div className="grid grid-cols-2 gap-3">
                                    {['1', '2'].map((conc) => (
                                        <button
                                            key={conc}
                                            onClick={() => setLidoConc(conc)}
                                            className={`p-3 rounded-lg border text-sm font-medium transition-all ${
                                                lidoConc === conc ? 'bg-blue-50 border-blue-500 text-blue-700 shadow-sm' : 'bg-white border-slate-200 text-slate-600'
                                            }`}
                                        >
                                            {conc}% Lidocaine
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Age Group Selection */}
                            <div>
                                <label className="block text-sm font-medium text-slate-600 mb-2">Patient Age Group</label>
                                <div className="grid grid-cols-3 gap-2">
                                    {Object.entries(AGE_GUIDELINES).map(([key, data]) => (
                                        <button
                                            key={key}
                                            onClick={() => setAgeGroup(key)}
                                            className={`p-2 rounded-lg border text-xs font-medium transition-all flex flex-col items-center justify-center h-20 ${
                                                ageGroup === key ? 'bg-emerald-50 border-emerald-500 text-emerald-700 shadow-sm' : 'bg-white border-slate-200 text-slate-600'
                                            }`}
                                        >
                                            {key === 'infant' ? <BabyIcon size={18} className="mb-1"/> : <UserIcon size={18} className="mb-1"/>}
                                            {data.label}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* Results Section */}
                        {result ? (
                            <div className="bg-white rounded-xl shadow-lg border-t-4 border-blue-500 overflow-hidden">
                                <div className="p-6 bg-blue-50/50 text-center">
                                    <p className="text-slate-500 font-medium mb-1 uppercase tracking-wide text-xs">Total Volume to Draw</p>
                                    <div className="text-5xl font-bold text-blue-600 flex items-center justify-center gap-2">
                                        {result.volume}
                                        <span className="text-2xl text-slate-400 font-medium">mL</span>
                                    </div>
                                </div>

                                <div className="p-5 border-t border-slate-100 space-y-4">
                                    <div className="bg-amber-50 p-4 rounded-lg border border-amber-200">
                                        <h3 className="font-bold text-amber-900 text-sm mb-2 flex items-center gap-2">
                                            <SyringeIcon size={18} /> Reconstitution Instructions
                                        </h3>
                                        <div className="text-sm text-amber-800 space-y-2">
                                            {lidoConc === '1' ? (
                                                <p>Add <strong>{result.lidoVol} mL</strong> of 1% Lidocaine directly to vial.</p>
                                            ) : (
                                                <div className="space-y-1">
                                                    <p className="font-bold border-b border-amber-200 pb-1 mb-1">Create 1% Concentration (1:1 mix):</p>
                                                    <p>1. Draw <strong>{result.lidoVol} mL</strong> of 2% Lidocaine.</p>
                                                    <p>2. Draw <strong>{result.salineVol} mL</strong> of Sterile Saline.</p>
                                                    <p>3. Add total mixture ({vialSize === '500' ? '1.0' : '2.1'} mL) to vial.</p>
                                                </div>
                                            )}
                                        </div>
                                    </div>

                                    <div className="text-sm space-y-2">
                                        {result.numInjections > 1 ? (
                                            <div className="flex items-start gap-2 p-3 bg-red-50 text-red-700 rounded-lg border border-red-100 font-medium">
                                                <AlertCircleIcon size={18} className="mt-0.5 shrink-0" />
                                                <span>Split dose required: Please divide into <strong>{result.numInjections} separate injections</strong> (~{(result.volume / result.numInjections).toFixed(1)} mL/site).</span>
                                            </div>
                                        ) : (
                                            <div className="text-emerald-700 font-medium flex items-center gap-2">✓ Safe for single injection site.</div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div className="text-center p-8 text-slate-400 bg-white rounded-xl border border-dashed border-slate-200">
                                <p>Enter dose details to see calculation</p>
                            </div>
                        )}
                    </div>

                    <div className="mt-8 text-center px-4">
                        <p className="text-[10px] text-slate-400 leading-tight">
                        <strong>Disclaimer:</strong> Educational tool only. Always verify calculations and institutional protocols.
                        </p>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <RocephinCalculator />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
