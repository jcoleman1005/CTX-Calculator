<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocephin Calculator</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- ICONS ---
        const CalculatorIcon = ({size=24, className=""}) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg>
        );
        const SyringeIcon = ({size=24, className=""}) => (
             <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m18 15-6-6"/><path d="m17 10 4-4"/><path d="m12 5 4-4"/><path d="m5 16 6-6"/><path d="m8 20 6-6"/><path d="m1 21 2-2"/><path d="m19 6 3-3"/><path d="m2 18 3 3"/></svg>
        );
        const AlertCircleIcon = ({size=24, className=""}) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
        );
        const InfoIcon = ({size=24, className=""}) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        );
        const BabyIcon = ({size=24, className=""}) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M9 12h.01"/><path d="M15 12h.01"/><path d="M10 16c.5.3 1.2.5 2 .5s1.5-.2 2-.5"/><path d="M19 6.3a9 9 0 0 1 1.8 3.9 2 2 0 0 1 0 3.8 9 9 0 0 1-17.6 0 2 2 0 0 1 0-3.8A9 9 0 0 1 12 3v0a9 9 0 0 1 7 3.3z"/></svg>
        );
        const UserIcon = ({size=24, className=""}) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        );
        const FlaskIcon = ({size=24, className=""}) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M10 2v7.31"/><path d="M14 2v7.31"/><path d="M8.5 2h7"/><path d="M14 9.3a6.5 6.5 0 1 1-4 0"/><path d="M5.52 16h12.96"/></svg>
        );
        const BeakerEditIcon = ({size=24, className=""}) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M4.5 3h15"/><path d="M6 3v16a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V3"/><path d="M6 14h12"/><path d="M13.5 11.5 18 16"/><path d="m18 11.5-4.5 4.5"/></svg>
        );

        // --- MAIN APP COMPONENT ---
        const RocephinCalculator = () => {
            const [doseOrdered, setDoseOrdered] = useState('');
            const [vialSize, setVialSize] = useState('1000'); 
            const [lidoConc, setLidoConc] = useState('1'); 
            const [ageGroup, setAgeGroup] = useState('child_older');
            const [showCustomYield, setShowCustomYield] = useState(false);
            const [customYield, setCustomYield] = useState('');
            const [result, setResult] = useState(null);

            const MAX_DOSE = 1000;

            const VIAL_DATA = {
                '500': { mg: 500, diluent: 1.0, totalVolume: 1.4 },
                '1000': { mg: 1000, diluent: 2.1, totalVolume: 2.9 }
            };

            const AGE_GUIDELINES = {
                'infant': { label: 'Infant (< 1 yr)', maxPerSite: 1.0 },
                'toddler': { label: 'Toddler (1-2 yrs)', maxPerSite: 1.5 },
                'child_older': { label: 'Child (> 2 yrs)', maxPerSite: 2.0 }
            };

            useEffect(() => {
                setCustomYield('');
                setShowCustomYield(false);
            }, [vialSize]);

            useEffect(() => {
                calculate();
            }, [doseOrdered, vialSize, lidoConc, ageGroup, showCustomYield, customYield]);

            const handleDoseChange = (e) => {
                let val = e.target.value;
                if (parseFloat(val) > MAX_DOSE) {
                    val = MAX_DOSE.toString();
                }
                setDoseOrdered(val);
            };

            const getRecommendedVial = () => {
                const dose = parseFloat(doseOrdered);
                if (!dose || isNaN(dose)) return null;
                return dose <= 500 ? '500' : '1000';
            };
            const recommendedVial = getRecommendedVial();

            const calculate = () => {
                const dose = parseFloat(doseOrdered);
                if (!dose || isNaN(dose)) {
                    setResult(null);
                    return;
                }

                const vial = VIAL_DATA[vialSize];
                let yieldVolume = vial.totalVolume;
                if (showCustomYield && customYield && !isNaN(parseFloat(customYield))) {
                    yieldVolume = parseFloat(customYield);
                }

                const calculatedVolume = (dose / vial.mg) * yieldVolume;
                const roundedVolume = Math.round(calculatedVolume * 10) / 10;
                const guideline = AGE_GUIDELINES[ageGroup];
                const numInjections = Math.ceil(roundedVolume / guideline.maxPerSite);
                
                setResult({
                    volume: roundedVolume,
                    exactVolume: calculatedVolume.toFixed(2),
                    numInjections,
                    maxPerSite: guideline.maxPerSite,
                    vialUsed: vial,
                    usedYield: yieldVolume, 
                    isCustom: (yieldVolume !== vial.totalVolume)
                });
            };

            return (
                <div className="max-w-md mx-auto min-h-screen p-4 sm:p-6 pb-20">
                    
                    {/* Header */}
                    <div className="bg-blue-600 text-white p-4 rounded-xl shadow-lg mb-6 flex items-center gap-3">
                        <div className="bg-white/20 p-2 rounded-lg">
                            <CalculatorIcon size={24} />
                        </div>
                        <div>
                            <h1 className="text-xl font-bold">Rocephin Calculator</h1>
                            <p className="text-blue-100 text-xs">IM Reconstitution Helper</p>
                        </div>
                    </div>

                    <div className="space-y-6">
                        
                        {/* Input Section */}
                        <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-4">
                            <h2 className="font-semibold text-slate-700 flex items-center gap-2">
                                <InfoIcon size={18} /> Medication Details
                            </h2>

                            {/* Dose Input */}
                            <div>
                                <label className="block text-sm font-medium text-slate-600 mb-1">
                                    Dose Ordered (mg)
                                </label>
                                <div className="relative">
                                    <input
                                        type="number"
                                        value={doseOrdered}
                                        onChange={handleDoseChange}
                                        max={MAX_DOSE}
                                        placeholder="e.g. 500"
                                        className={`w-full pl-3 pr-12 py-3 bg-slate-50 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-lg font-medium ${parseFloat(doseOrdered) >= MAX_DOSE ? 'border-red-300' : 'border-slate-300'}`}
                                    />
                                    <span className="absolute right-4 top-3.5 text-slate-400 font-medium">mg</span>
                                </div>
                                {parseFloat(doseOrdered) >= MAX_DOSE && (
                                    <p className="text-[10px] text-red-500 font-bold mt-1 uppercase tracking-tight">Maximum safety limit reached (1000mg).</p>
                                )}
                            </div>

                            {/* Vial Selection */}
                            <div>
                                <label className="block text-sm font-medium text-slate-600 mb-2">
                                   Rocephin Vial Size Used
                                </label>
                                <div className="grid grid-cols-2 gap-3 mb-3">
                                    {Object.keys(VIAL_DATA).map((size) => {
                                        const isRecommended = recommendedVial === size;
                                        return (
                                            <button
                                                key={size}
                                                onClick={() => setVialSize(size)}
                                                className={`p-3 rounded-lg border text-sm font-medium transition-all relative ${
                                                    vialSize === size
                                                    ? 'bg-blue-50 border-blue-500 text-blue-700 shadow-sm'
                                                    : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'
                                                }`}
                                            >
                                                {isRecommended && (
                                                    <span className="absolute -top-2.5 right-2 bg-emerald-100 text-emerald-700 text-[10px] font-bold px-2 py-0.5 rounded-full border border-emerald-200 shadow-sm">
                                                        Rec. for Dose
                                                    </span>
                                                )}
                                                {size} mg
                                                <div className="text-xs font-normal opacity-75 mt-1">
                                                    Std Yield: {VIAL_DATA[size].totalVolume} mL
                                                </div>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* Lidocaine Selection */}
                            <div>
                                <label className="block text-sm font-medium text-slate-600 mb-2">
                                    Lidocaine Concentration Available
                                </label>
                                <div className="grid grid-cols-2 gap-3">
                                    <button
                                        onClick={() => setLidoConc('1')}
                                        className={`p-3 rounded-lg border text-sm font-medium transition-all ${
                                            lidoConc === '1'
                                            ? 'bg-blue-50 border-blue-500 text-blue-700 shadow-sm'
                                            : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'
                                        }`}
                                    >
                                        1% Lidocaine
                                    </button>
                                    <button
                                        onClick={() => setLidoConc('2')}
                                        className={`p-3 rounded-lg border text-sm font-medium transition-all ${
                                            lidoConc === '2'
                                            ? 'bg-blue-50 border-blue-500 text-blue-700 shadow-sm'
                                            : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'
                                        }`}
                                    >
                                        2% Lidocaine
                                    </button>
                                </div>
                            </div>

                            {/* Age Group Selection */}
                            <div>
                                <label className="block text-sm font-medium text-slate-600 mb-2">
                                    Patient Age (for injection limits)
                                </label>
                                <div className="grid grid-cols-3 gap-2">
                                    {Object.entries(AGE_GUIDELINES).map(([key, data]) => (
                                        <button
                                            key={key}
                                            onClick={() => setAgeGroup(key)}
                                            className={`p-2 rounded-lg border text-xs font-medium transition-all flex flex-col items-center justify-center text-center h-20 ${
                                                ageGroup === key
                                                ? 'bg-emerald-50 border-emerald-500 text-emerald-700 shadow-sm'
                                                : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'
                                            }`}
                                        >
                                            {key === 'infant' ? <BabyIcon size={18} className="mb-1"/> : <UserIcon size={18} className="mb-1"/>}
                                            {data.label}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* Results Section */}
                        {result ? (
                            <div className="bg-white rounded-xl shadow-lg border-t-4 border-blue-500 overflow-hidden">
                                <div className="p-6 bg-blue-50/50">
                                    <div className="text-center">
                                        <p className="text-slate-500 font-medium mb-1 uppercase tracking-wide text-xs">Total Volume to Draw</p>
                                        <div className="text-5xl font-bold text-blue-600 flex items-center justify-center gap-2">
                                            {result.volume}
                                            <span className="text-2xl text-slate-400 font-medium">mL</span>
                                        </div>
                                        <p className="text-xs text-slate-400 mt-2">
                                            (Calculated: {result.exactVolume} mL rounded)
                                        </p>
                                        {result.isCustom && (
                                            <div className="mt-2 inline-flex items-center gap-1 px-2 py-1 bg-amber-100 text-amber-800 text-[10px] font-bold rounded-full">
                                                Based on Actual Yield: {result.usedYield} mL
                                            </div>
                                        )}
                                    </div>
                                </div>

                                <div className="p-5 border-t border-slate-100 space-y-4">
                                    <div className="flex items-start gap-3">
                                        <div className="p-2 bg-emerald-100 text-emerald-600 rounded-full mt-1">
                                            <SyringeIcon size={20} />
                                        </div>
                                        <div>
                                            <h3 className="font-semibold text-slate-800">Administration Guide</h3>
                                            <div className="text-sm text-slate-600 mt-1 space-y-2">
                                                <p>
                                                    <span className="font-medium text-slate-900">Total Dose:</span> {doseOrdered} mg
                                                </p>
                                                
                                                {result.numInjections > 1 ? (
                                                    <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 mt-2">
                                                        <div className="flex items-center gap-2 text-amber-700 font-bold mb-1">
                                                            <AlertCircleIcon size={16} />
                                                            Split Dose Required
                                                        </div>
                                                        <p>
                                                            Volume exceeds limit for this age ({AGE_GUIDELINES[ageGroup].maxPerSite} mL/site). 
                                                            Please split into <span className="font-bold">{result.numInjections} separate injections</span>.
                                                        </p>
                                                        <p className="mt-2 text-amber-800 font-medium">
                                                            ~{(result.volume / result.numInjections).toFixed(1)} mL per site
                                                        </p>
                                                    </div>
                                                ) : (
                                                    <p className="text-emerald-700 font-medium flex items-center gap-2 mt-2">
                                                        ✓ Safe for single injection site
                                                    </p>
                                                )}
                                            </div>
                                        </div>
                                    </div>

                                    {/* Reconstitution Instructions */}
                                    <div className={`p-4 rounded-lg text-sm border ${lidoConc === '2' ? 'bg-amber-50 border-amber-200 text-amber-900' : 'bg-slate-50 border-slate-100 text-slate-600'}`}>
                                        <h4 className="font-semibold mb-2 flex items-center gap-2">
                                            <FlaskIcon size={16}/> Reconstitution ({result.vialUsed.mg}mg Vial)
                                        </h4>
                                        
                                        {lidoConc === '1' ? (
                                            <ul className="list-disc list-inside space-y-1">
                                                <li>Dilute with <strong>{result.vialUsed.diluent} mL</strong> of 1% Lidocaine.</li>
                                                {result.isCustom ? (
                                                    <li className="font-medium text-amber-700">Note: You observed a total yield of {result.usedYield} mL.</li>
                                                ) : (
                                                    <li>Standard total fluid volume is <strong>{result.vialUsed.totalVolume} mL</strong>.</li>
                                                )}
                                                <li>Ensure all clumps are dissolved before drawing.</li>
                                            </ul>
                                        ) : (
                                            <div className="space-y-2">
                                                <p className="font-medium text-amber-800 border-b border-amber-200 pb-1">
                                                    Required: Dilute 2% Lidocaine to 1%
                                                </p>
                                                <ul className="space-y-1 ml-1">
                                                    <li>1. Draw <strong>{(result.vialUsed.diluent / 2).toFixed(2)} mL</strong> of 2% Lidocaine.</li>
                                                    <li>2. Draw <strong>{(result.vialUsed.diluent / 2).toFixed(2)} mL</strong> of Sterile Saline.</li>
                                                    <li>3. Combine to make {result.vialUsed.diluent} mL of 1% solution.</li>
                                                    <li>4. Inject mixture into Rocephin vial.</li>
                                                </ul>
                                            </div>
                                        )}
                                    </div>

                                    {/* Custom Yield Toggle */}
                                    <div className="flex flex-col gap-2 p-3 bg-slate-50 rounded-lg border border-slate-100 mt-2">
                                        <div className="flex items-center justify-between">
                                            <label className="text-xs font-semibold text-slate-600 flex items-center gap-1.5 cursor-pointer" onClick={() => setShowCustomYield(!showCustomYield)}>
                                                <BeakerEditIcon size={14} />
                                                Reconstituted Volume differs?
                                            </label>
                                            <input 
                                                type="checkbox" 
                                                checked={showCustomYield} 
                                                onChange={(e) => setShowCustomYield(e.target.checked)}
                                                className="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 border-gray-300"
                                            />
                                        </div>

                                        {showCustomYield && (
                                            <div className="mt-2 animate-in fade-in slide-in-from-top-1 duration-200">
                                                <label className="block text-[10px] text-slate-500 uppercase tracking-wide font-bold mb-1">
                                                    Actual Total Volume in Vial (mL)
                                                </label>
                                                <input
                                                    type="number"
                                                    value={customYield}
                                                    onChange={(e) => setCustomYield(e.target.value)}
                                                    placeholder={`e.g. ${VIAL_DATA[vialSize].totalVolume}`}
                                                    className="w-full p-2 text-sm border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none"
                                                />
                                                <p className="text-[10px] text-amber-600 mt-1 leading-tight">
                                                    * This will override the standard {VIAL_DATA[vialSize].totalVolume} mL math assumption.
                                                </p>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div className="text-center p-8 text-slate-400 bg-white rounded-xl border border-slate-200 border-dashed">
                                <SyringeIcon size={48} className="mx-auto mb-3 opacity-20" />
                                <p>Enter a dose to see calculation</p>
                            </div>
                        )}
                    </div>

                    <div className="mt-8 text-center px-4">
                        <p className="text-[10px] text-slate-400 leading-tight">
                        <strong>Disclaimer:</strong> This tool is for educational and double-checking purposes only. 
                        Always verify calculations and follow your institution's specific protocols.
                        </p>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<RocephinCalculator />);
    </script>
</body>
</html>
